name: Validate AI Tea Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --omit=dev
      - run: python -m pip install -r requirements.runtime.txt
      - run: node --check server.mjs
      - run: node --check lib/analyzer.mjs
      - run: node --check lib/store.mjs
      - run: python -m py_compile scripts/predict.py
      - run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('miniprogram/app.json','utf8')); console.log('configuration ok')"
