<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>AI茶查查 · 移动巡园端</title>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <div class="mobile-shell">
    <header class="mobile-top">
      <div class="mobile-brand">AI茶查查 · 移动巡园端</div>
      <div class="mobile-sub">拍照早筛、专家复核、处置复查一站完成</div>
      <div class="mobile-stats" aria-label="业务统计">
        <button class="stat-card" type="button" data-stat-target="history" data-tooltip="查看全部识别记录">
          <span class="hero-number" id="mRecords">0</span>
          <span>识别记录</span>
        </button>
        <button class="stat-card" type="button" data-stat-target="reviews" data-tooltip="查看等待农技专家核验的记录">
          <span class="hero-number" id="mReviews">0</span>
          <span>待复核</span>
        </button>
        <button class="stat-card" type="button" data-stat-target="tasks" data-tooltip="查看待完成的二次复查任务">
          <span class="hero-number" id="mTasks">0</span>
          <span>复查任务</span>
        </button>
      </div>
    </header>

    <main class="mobile-body">
      <section class="mview" id="m-home">
        <div class="mobile-card">
          <div class="section-head"><h3 class="section-title">今日巡园</h3><button class="help-button" type="button" data-help="patrol" aria-label="查看今日巡园说明" title="查看说明">?</button></div>
          <div class="mobile-actions">
            <button class="btn" type="button" data-mgo="capture">拍照识别</button>
            <button class="btn secondary" type="button" data-mgo="tasks">查看任务</button>
          </div>
        </div>
        <div class="mobile-card">
          <div class="section-head"><h3 class="section-title">地块风险</h3><button class="help-button" type="button" data-help="fields" aria-label="查看地块风险说明" title="查看说明">?</button></div>
          <div class="mobile-list" id="mFieldList"></div>
        </div>
        <div class="mobile-card">
          <div class="section-head"><h3 class="section-title">最近记录</h3><button class="help-button" type="button" data-help="records" aria-label="查看识别记录说明" title="查看说明">?</button></div>
          <div class="mobile-list" id="mRecent"></div>
        </div>
      </section>

      <section class="mview" id="m-capture" style="display:none">
        <div class="mobile-card">
          <div class="section-head"><h3 class="section-title">现场拍照早筛</h3><button class="help-button" type="button" data-help="capture" aria-label="查看拍照识别说明" title="查看说明">?</button></div>
          <form id="mUpload">
            <div class="field"><label>巡查地块</label><select name="fieldId" id="mFieldSelect"></select></div>
            <div class="field" style="margin-top:10px"><label>现场备注</label><textarea name="note" rows="2" placeholder="叶背、嫩梢、天气和周边发生情况"></textarea></div>
            <div class="field" style="margin-top:10px"><label>拍照或选择图片</label><input type="file" name="image" accept="image/*" capture="environment" multiple required><div class="small muted">可批量选择图片，系统会逐张识别。</div></div>
            <input type="hidden" name="reporter" value="移动巡园员">
            <button class="btn" style="width:100%;margin-top:12px" type="submit">开始识别</button>
          </form>
        </div>
        <div class="mobile-card" id="mResult" style="display:none">
          <div class="preview compact-preview"><img id="mResultImage" alt="巡园识别图片"></div>
          <h2 id="mResultName"></h2>
          <div id="mResultDetail"></div>
          <section class="knowledge-panel" id="mKnowledge" hidden aria-live="polite"></section>
          <div class="mobile-actions" style="margin-top:14px">
            <button class="btn secondary" type="button" id="mReview">提交专家复核</button>
            <button class="btn" type="button" id="mTreat">记录处置</button>
          </div>
          <p class="result-disclaimer" id="mDisclaimer"></p>
          <p class="small muted" id="mBatchSummary" aria-live="polite"></p>
        </div>
      </section>

      <section class="mview" id="m-history" style="display:none">
        <div class="mobile-card">
          <div class="section-head"><h3 class="section-title" id="mHistoryTitle">巡查历史</h3><button class="help-button" type="button" data-help="records" aria-label="查看巡查历史说明" title="查看说明">?</button></div>
          <div class="mobile-list" id="mHistory"></div>
        </div>
      </section>

      <section class="mview" id="m-tasks" style="display:none">
        <div class="mobile-card">
          <div class="section-head"><h3 class="section-title">复查任务</h3><button class="help-button" type="button" data-help="tasks" aria-label="查看复查任务说明" title="查看说明">?</button></div>
          <div class="mobile-list" id="mTaskList"></div>
        </div>
      </section>
    </main>

    <nav class="mobile-nav" aria-label="主导航">
      <a href="#home" class="active" data-mgo="home"><span class="nav-emoji">⌂</span>首页</a>
      <a href="#capture" data-mgo="capture"><span class="nav-emoji">◎</span>识别</a>
      <a href="#history" data-mgo="history"><span class="nav-emoji">▤</span>记录</a>
      <a href="#tasks" data-mgo="tasks"><span class="nav-emoji">◷</span>任务</a>
    </nav>
  </div>

  <div class="modal-backdrop" id="onboardingModal" role="dialog" aria-modal="true" aria-labelledby="onboardingTitle" hidden>
    <div class="guide-dialog">
      <div class="guide-kicker">首次使用</div>
      <h2 id="onboardingTitle">三步完成巡园闭环</h2>
      <ol class="guide-steps">
        <li><span>1</span><div><b>拍照上传</b><p>选择地块，拍清叶片正反面、嫩梢或虫体。</p></div></li>
        <li><span>2</span><div><b>AI识别</b><p>查看识别类别、置信度和对应治理建议。</p></div></li>
        <li><span>3</span><div><b>待复核/复查</b><p>不确定样本交由农技专家核验，存疑记录生成复查任务。</p></div></li>
      </ol>
      <div class="modal-actions"><button class="btn secondary" type="button" id="guideSkip">暂不查看</button><button class="btn" type="button" id="guideStart">开始巡园</button></div>
    </div>
  </div>

  <div class="modal-backdrop" id="helpModal" role="dialog" aria-modal="true" aria-labelledby="helpTitle" hidden>
    <div class="help-dialog">
      <button class="modal-close" type="button" id="helpClose" aria-label="关闭说明" title="关闭">×</button>
      <h2 id="helpTitle"></h2>
      <p id="helpText"></p>
    </div>
  </div>

  <div class="toast" id="mToast"></div>
  <script src="../shared/demo-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
