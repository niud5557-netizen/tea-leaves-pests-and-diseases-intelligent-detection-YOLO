<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="description" content="AI茶查查·移动巡园端——现场拍照早筛、专家复核、处置复查一站完成。">
  <title>AI茶查查 · 移动巡园端</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <style>
    .hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
    .hero-stats .hs{text-align:center}
    .hero-stats .hero-number{font-size:28px;font-weight:900;letter-spacing:-.02em}
    .hero-stats .small{font-size:11px;opacity:.9}
    .btn[data-mgo="capture"]{display:flex;align-items:center;justify-content:center;gap:6px}
  </style>
</head>
<body>
  <div class="mobile-shell">
    <header class="mobile-top">
      <div class="mobile-brand">AI茶查查 · 移动巡园端</div>
      <div class="mobile-sub">拍照早筛、专家复核、处置复查一站完成</div>
      <div class="hero-stats">
        <div class="hs"><div class="hero-number" id="mRecords">0</div><div class="small">识别记录</div></div>
        <div class="hs"><div class="hero-number" id="mReviews">0</div><div class="small">待复核</div></div>
        <div class="hs"><div class="hero-number" id="mTasks">0</div><div class="small">复查任务</div></div>
      </div>
    </header>

    <main class="mobile-body">
      <!-- 首页 -->
      <section class="mview" id="m-home">
        <div class="mobile-card">
          <h3 class="section-title">今日巡园</h3>
          <div class="mobile-actions">
            <button class="btn" data-mgo="capture">📷 拍照识别</button>
            <button class="btn secondary" data-mgo="tasks">◷ 查看任务</button>
          </div>
        </div>
        <div class="mobile-card">
          <div class="section-head">
            <h3 class="section-title">地块风险</h3>
            <span class="small muted">自动更新</span>
          </div>
          <div class="mobile-list" id="mFieldList"></div>
        </div>
        <div class="mobile-card">
          <h3 class="section-title">最近记录</h3>
          <div class="mobile-list" id="mRecent"></div>
        </div>
      </section>

      <!-- 拍照识别 -->
      <section class="mview" id="m-capture" style="display:none">
        <div class="mobile-card">
          <h3 class="section-title">现场拍照早筛</h3>
          <form id="mUpload">
            <div class="field">
              <label>巡查地块</label>
              <select name="fieldId" id="mFieldSelect"></select>
            </div>
            <div class="field" style="margin-top:10px">
              <label>现场备注</label>
              <textarea name="note" rows="2" placeholder="叶背、嫩梢、天气和周边发生情况"></textarea>
            </div>
            <div class="field" style="margin-top:10px">
              <label>拍照或选择图片</label>
              <input type="file" name="image" accept="image/*" capture="environment" required>
            </div>
            <input type="hidden" name="reporter" value="移动巡园员">
            <button class="btn" style="width:100%;margin-top:12px" type="submit">开始识别</button>
          </form>
        </div>
        <div class="mobile-card" id="mResult" style="display:none">
          <div class="preview" style="min-height:220px">
            <img id="mResultImage" alt="识别图片">
            <div class="lesion-box" id="mLesion"></div>
          </div>
          <h2 id="mResultName"></h2>
          <div id="mResultDetail"></div>
          <div class="mobile-actions" style="margin-top:14px">
            <button class="btn secondary" id="mReview">提交专家复核</button>
            <button class="btn" id="mTreat">记录处置</button>
          </div>
          <p class="footer-note" id="mDisclaimer"></p>
        </div>
      </section>

      <!-- 历史记录 -->
      <section class="mview" id="m-history" style="display:none">
        <div class="mobile-card">
          <h3 class="section-title">巡查历史</h3>
          <div class="mobile-list" id="mHistory"></div>
        </div>
      </section>

      <!-- 处置与复查任务 -->
      <section class="mview" id="m-tasks" style="display:none">
        <div class="mobile-card">
          <h3 class="section-title">处置与复查任务</h3>
          <div class="mobile-list" id="mTaskList"></div>
        </div>
      </section>
    </main>

    <nav class="mobile-nav">
      <a href="#" class="active" data-mgo="home"><span class="nav-emoji">⌂</span>首页</a>
      <a href="#" data-mgo="capture"><span class="nav-emoji">◎</span>识别</a>
      <a href="#" data-mgo="history"><span class="nav-emoji">▤</span>记录</a>
      <a href="#" data-mgo="tasks"><span class="nav-emoji">◷</span>任务</a>
    </nav>
  </div>
  <div class="toast" id="mToast"></div>
  <script src="../shared/demo-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
